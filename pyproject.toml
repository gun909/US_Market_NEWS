[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "macropulse"
version = "0.1.0"
description = "US market news analysis and cross-market confirmation engine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
market = ["yfinance>=0.2.54"]
ai = ["transformers>=4.48", "torch>=2.2"]
dev = ["pytest>=8.0"]

[project.scripts]
macropulse = "macropulse.cli:main"

[tool.setuptools.packages.find]
include = ["macropulse*"]

