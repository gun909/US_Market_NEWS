name: MacroPulse RSS Monitor

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: macropulse-rss-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONUTF8: "1"
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      NEWS_RSS_URL: ${{ vars.NEWS_RSS_URL }}

    steps:
      - name: Check out private repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install MacroPulse
        run: python -m pip install -e ".[market]"

      - name: Analyze all unsent RSS articles and notify Telegram
        run: python -m macropulse --latest --market yfinance --telegram

      - name: Persist delivery history in the private repository
        if: always()
        shell: bash
        run: |
          if [[ ! -f data/macropulse.db ]]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/macropulse.db
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: update MacroPulse delivery history"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
